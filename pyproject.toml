[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "EffectGuard"
version = "0.1.0"
description = "Deterministic recovery baseline simulator for ambiguous external effects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "pytest>=8.0",
    "requests>=2.31",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
include = ["effectguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
